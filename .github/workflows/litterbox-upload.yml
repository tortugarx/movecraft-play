name: Upload CrazyGames builds to Litterbox

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload builds
        shell: bash
        run: |
          basic_url=$(curl --fail --silent --show-error --max-time 180 \
            -F reqtype=fileupload -F time=72h \
            -F fileToUpload=@downloads/moving-empire-crazygames-basic.zip \
            https://litterbox.catbox.moe/resources/internals/api.php)
          full_url=$(curl --fail --silent --show-error --max-time 180 \
            -F reqtype=fileupload -F time=72h \
            -F fileToUpload=@downloads/moving-empire-crazygames-full.zip \
            https://litterbox.catbox.moe/resources/internals/api.php)
          echo "BASIC_URL=$basic_url"
          echo "FULL_URL=$full_url"
